<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Caveat:wght@600;700&amp;family=Karla:ital,wght@0,400;0,500;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
.cel{--paper:#F4ECDA;--ink:#1D3F4E;--teal:#256F7B;--accent:#C9461F;--marker:#F0B233;--soft:#E9DFC8;--nuc:#7E7FA8;--er:#5B8C9E;--gold:#D39B32;--terra:#C0643C;--cyt:#E8DDC4}
.cel.is-dark{--paper:#102D38;--ink:#F4ECDA;--teal:#80BCC0;--accent:#EF936C;--marker:#D6A94D;--soft:#17394A;--nuc:#A9AACC;--er:#86B6C4;--gold:#D6A94D;--terra:#E08A63;--cyt:#163A48}
.cel .cam{transform-box:view-box;transform-origin:0 0;transition:transform .85s cubic-bezier(.45,0,.2,1)}
.cel .grp{transition:opacity .6s ease}
.cel .mv{transform-box:view-box;transition:transform .85s cubic-bezier(.45,0,.2,1),opacity .6s ease}
.cel .lbl{animation:celLbl .45s .55s both}
.cel .lens{animation:celLens .5s .6s both}
@keyframes celLbl{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes celLens{from{opacity:0;scale:.92}to{opacity:1;scale:1}}
.cel .pt{animation:celDrift 11s ease-in-out infinite alternate}
.cel .pt1{animation-duration:13s;animation-delay:-4s}.cel .pt2{animation-duration:9s;animation-delay:-2s}.cel .pt3{animation-duration:15s;animation-delay:-7s}
@keyframes celDrift{from{translate:0 0}to{translate:9px -7px}}
.cel .vt{animation:celV1 7s ease-in-out infinite}
.cel .vt2{animation-name:celV2;animation-duration:8s;animation-delay:-3s}
.cel .vt3{animation-name:celV3;animation-duration:9s;animation-delay:-5s}
@keyframes celV1{0%{translate:0 0;opacity:0}12%{opacity:1}80%{opacity:1}100%{translate:40px -32px;opacity:0}}
@keyframes celV2{0%{translate:0 0;opacity:0}12%{opacity:1}85%{opacity:1}100%{translate:14px -104px;opacity:0}}
@keyframes celV3{0%{translate:0 0;opacity:0}15%{opacity:1}85%{opacity:1}100%{translate:-60px 36px;opacity:0}}
.cel.is-paused .pt,.cel.is-paused .vt{animation-play-state:paused}
.cel.is-rm .cam,.cel.is-rm .grp,.cel.is-rm .mv{transition:none}
.cel.is-rm .pt,.cel.is-rm .vt,.cel.is-rm .lbl,.cel.is-rm .lens{animation:none}
.cel .pause:hover{background:var(--ink);color:var(--paper)}
.cel .pause:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.cel .cam,.cel .grp,.cel .mv{transition:none}.cel .pt,.cel .vt,.cel .lbl,.cel .lens{animation:none}}
</style>
</helmet>
<div class="cel {{rootClass}}" style="position: relative; width: {{size}}px; height: {{size}}px; font-family: Karla, 'Trebuchet MS', sans-serif; color: var(--ink)">
