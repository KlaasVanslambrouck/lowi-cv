<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>NidusMockups – bestaande embed (1-op-1 uit de repository)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&amp;display=swap">
<style>
/* ── Ongewijzigde kopie van styles/nidusMockup.module.css (klassen geprefixt nm-) ── */
.nm-root{--cv-bg:#f3efe7;--cv-surface:#e8e2d8;--cv-surface-raised:#faf7f1;--cv-text:#171820;--cv-text-soft:#3e3d43;--cv-muted:#6f6a70;--cv-border:rgba(23,24,32,.16);--cv-copper:#a95f2c;
--font-fraunces:'Fraunces';--font-dm-sans:'DM Sans';--font-dm-mono:'DM Mono';
--cv-font-serif:var(--font-fraunces),Georgia,serif;--cv-font-sans:var(--font-dm-sans),system-ui,sans-serif;--cv-font-mono:var(--font-dm-mono),ui-monospace,monospace;
font-family:var(--cv-font-sans);font-size:16px;line-height:1.65;color:var(--cv-text);-webkit-font-smoothing:antialiased}
.nm-root.nm-dark{--cv-bg:#101118;--cv-surface:#171923;--cv-surface-raised:#1e202b;--cv-text:#f1ece2;--cv-text-soft:#d8d2c8;--cv-muted:#9995a0;--cv-border:rgba(241,236,226,.14);--cv-copper:#c98245}
/* minimale reset uit app/globals.css, alleen binnen de embed */
.nm-root *,.nm-root *::before,.nm-root *::after{box-sizing:border-box;margin:0;padding:0}
.nm-root svg{display:block;max-width:100%}
.nm-root button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.nm-root ul,.nm-root ol{list-style:none}
.nm-root h1,.nm-root h2,.nm-root h3,.nm-root h4{font-family:var(--cv-font-serif);font-weight:500;line-height:1.15}
.nm-root :focus-visible{outline:2px solid var(--cv-copper);outline-offset:3px;border-radius:4px}
.nm-mockups {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.nm-note {
  max-width: 48rem;
  padding-left: 1rem;
  border-left: 2px solid var(--cv-copper);
  font-family: var(--cv-font-mono);
  font-size: 0.78rem;
  line-height: 1.65;
  color: var(--cv-muted);
}

.nm-deviceToggle {
  align-self: flex-start;
  display: inline-flex;
  gap: 0.2rem;
  padding: 0.25rem;
  border: 1px solid var(--cv-border);
  border-radius: 999px;
  background: var(--cv-surface);
}

.nm-deviceButton,
.nm-deviceActive {
  min-width: 5.5rem;
  min-height: 2.5rem;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  font-family: var(--cv-font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.05em;
  color: var(--cv-muted);
  transition:
    color 160ms ease,
    background-color 160ms ease;
}

.nm-deviceButton:hover {
  color: var(--cv-text);
}

.nm-deviceActive {
  color: var(--cv-bg);
  background-color: var(--cv-copper);
}

.nm-nidusFrame {
  --nidus-linen: #f2ede4;
  --nidus-cream: #faf7f2;
  --nidus-sage: #5a7358;
  --nidus-amber: #c4820a;
  --nidus-terra: #b85c38;
  --nidus-parchment: #ddd5c8;
  --nidus-ink: #1c1914;
  --nidus-font-serif: var(--font-fraunces), Georgia, serif;
  --nidus-font-sans: var(--font-dm-sans), system-ui, sans-serif;
  --nidus-font-mono: var(--font-dm-mono), ui-monospace, monospace;

  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--nidus-ink) 18%, transparent);
  border-radius: 18px;
  color: var(--nidus-ink);
  background: var(--nidus-linen);
  box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.18);
  font-family: var(--nidus-font-sans);
}

.nm-nidusFrame button:focus-visible {
  outline-color: var(--nidus-terra);
}

.nm-browserFrame {
  width: 100%;
  max-width: 56rem;
  height: 42rem;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
}

.nm-browserChrome {
  flex: 0 0 auto;
  min-height: 3.2rem;
  display: flex;
  align-items: center;
  padding: 0 1rem;
  border-bottom: 1px solid var(--nidus-parchment);
  background: var(--nidus-cream);
}

.nm-windowControls {
  display: flex;
  gap: 0.45rem;
}

.nm-windowControls span {
  width: 0.68rem;
  height: 0.68rem;
  border-radius: 50%;
  background: var(--nidus-parchment);
}

.nm-windowControls span:first-child {
  background: var(--nidus-terra);
}

.nm-windowControls span:nth-child(2) {
  background: var(--nidus-amber);
}

.nm-windowControls span:last-child {
  background: var(--nidus-sage);
}

.nm-webLayout {
  flex: 1;
  display: grid;
  grid-template-columns: 11.5rem minmax(0, 1fr);
  min-height: 0;
}

.nm-sidebar {
  display: flex;
  flex-direction: column;
  padding: 1.75rem 1rem 1.25rem;
  border-right: 1px solid var(--nidus-parchment);
  background: var(--nidus-cream);
}

.nm-sidebarBrand {
  padding: 0 0.65rem 1.5rem;
}

.nm-sidebarBrand p {
  font-family: var(--nidus-font-mono);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.2em;
  color: var(--nidus-terra);
}

.nm-sidebarBrand span {
  display: block;
  margin-top: 0.2rem;
  font-family: var(--nidus-font-serif);
  font-size: 1.15rem;
  font-style: italic;
  color: var(--nidus-ink);
}

.nm-sidebarNav {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.nm-sidebarItem,
.nm-sidebarItemActive,
.nm-sidebarItemDisabled {
  width: 100%;
  min-height: 2.55rem;
  display: grid;
  grid-template-columns: 1.35rem minmax(0, 1fr);
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 0.65rem;
  border-left: 3px solid transparent;
  border-radius: 0 10px 10px 0;
  font-family: var(--nidus-font-sans);
  font-size: 0.78rem;
  line-height: 1.2;
  text-align: left;
  color: color-mix(in srgb, var(--nidus-ink) 70%, transparent);
}

.nm-sidebarItem > span,
.nm-sidebarItemActive > span,
.nm-sidebarItemDisabled > span {
  font-size: 0.9rem;
  text-align: center;
}

.nm-sidebarItem:hover {
  color: var(--nidus-ink);
  background: var(--nidus-linen);
}

.nm-sidebarItemActive {
  border-left-color: var(--nidus-sage);
  color: var(--nidus-sage);
  background: color-mix(in srgb, var(--nidus-sage) 9%, transparent);
}

.nm-sidebarItemDisabled {
  opacity: 0.45;
  cursor: not-allowed;
  user-select: none;
}

.nm-sidebarFooter {
  margin-top: auto;
  padding: 1rem 0.65rem 0;
  border-top: 1px solid var(--nidus-parchment);
  font-family: var(--nidus-font-mono);
  font-size: 0.68rem;
  color: color-mix(in srgb, var(--nidus-ink) 52%, transparent);
}

.nm-contentPane {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(1.5rem, 4vw, 3rem);
}

.nm-screenContent {
  animation: screenFade 220ms ease both;
}

.nm-productLabel {
  margin-bottom: 0.35rem;
  font-family: var(--nidus-font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--nidus-terra);
}

.nm-screenTitle {
  margin-bottom: 1.5rem;
  font-family: var(--nidus-font-sans);
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 600;
  color: var(--nidus-ink);
}

.nm-dashboardDetail {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.nm-dashboardHeader {
  padding-bottom: 0.35rem;
}

.nm-dashboardDate,
.nm-detailEyebrow {
  font-family: var(--nidus-font-mono);
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--nidus-ink) 53%, transparent);
}

.nm-dashboardGreeting {
  margin-top: 0.3rem;
  font-family: var(--nidus-font-sans);
  font-size: clamp(1.45rem, 3.4vw, 2.15rem);
  font-weight: 500;
  color: var(--nidus-ink);
}

.nm-dashboardGreeting span {
  font-family: var(--nidus-font-serif);
  font-style: italic;
  color: var(--nidus-terra);
}

.nm-aiInsightCard,
.nm-weekReportCard,
.nm-weatherCard,
.nm-agendaCard,
.nm-healthCard,
.nm-energyLiveCard {
  border: 1px solid color-mix(in srgb, var(--nidus-parchment) 82%, transparent);
  border-radius: 18px;
  background: var(--nidus-cream);
  box-shadow: 0 0.45rem 1.3rem rgb(28 25 20 / 0.055);
}

.nm-aiInsightCard {
  padding: 1.2rem 1.25rem;
  border-left: 4px solid var(--nidus-terra);
  background: color-mix(in srgb, var(--nidus-terra) 6%, var(--nidus-cream));
}

.nm-aiInsightHeading {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.nm-aiInsightIcon {
  color: var(--nidus-terra);
}

.nm-aiInsightText {
  max-width: 46rem;
  margin-top: 0.65rem;
  font-size: 0.9rem;
  line-height: 1.65;
  color: color-mix(in srgb, var(--nidus-ink) 82%, transparent);
}

.nm-weekReportCard {
  padding: 1.2rem;
}

.nm-weekReportRows {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  margin-top: 0.9rem;
}

.nm-weekReportRow {
  display: grid;
  grid-template-columns: 1.3rem minmax(0, 1fr);
  gap: 0.7rem;
  padding: 0.85rem 0.95rem;
  border: 1px solid color-mix(in srgb, var(--nidus-amber) 18%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--nidus-amber) 8%, var(--nidus-cream));
}

.nm-weekReportIcon {
  padding-top: 0.08rem;
  color: var(--nidus-amber);
}

.nm-weekReportMain {
  min-width: 0;
}

.nm-weekReportTopline {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-size: 0.86rem;
}

.nm-weekReportTopline strong {
  font-weight: 600;
}

.nm-weekReportTopline span {
  flex: 0 0 auto;
  font-family: var(--nidus-font-serif);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--nidus-terra);
}

.nm-weekReportChange,
.nm-weekReportDetail {
  margin-top: 0.15rem;
  font-family: var(--nidus-font-mono);
  font-size: 0.64rem;
  line-height: 1.45;
}

.nm-weekReportChange {
  color: color-mix(in srgb, var(--nidus-ink) 55%, transparent);
}

.nm-weekReportDetail {
  color: var(--nidus-amber);
}

.nm-dashboardMiniGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.nm-weatherCard,
.nm-agendaCard {
  min-width: 0;
  padding: 1.15rem;
}

.nm-weatherPrimary {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nm-weatherTemp {
  flex: 0 0 auto;
  font-family: var(--nidus-font-serif);
  font-size: clamp(2rem, 5vw, 2.75rem);
  font-weight: 500;
  line-height: 1;
}

.nm-weatherCondition {
  font-size: 0.82rem;
  font-weight: 600;
}

.nm-weatherRange,
.nm-weatherTomorrow {
  font-family: var(--nidus-font-mono);
  font-size: 0.64rem;
  color: color-mix(in srgb, var(--nidus-ink) 56%, transparent);
}

.nm-weatherTomorrow {
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--nidus-parchment);
  color: var(--nidus-sage);
}

.nm-agendaList {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  margin-top: 0.75rem;
}

.nm-agendaList li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 0.7rem;
  align-items: baseline;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid var(--nidus-parchment);
  font-size: 0.78rem;
}

.nm-agendaList li:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.nm-agendaList time {
  font-family: var(--nidus-font-mono);
  font-size: 0.64rem;
  color: var(--nidus-terra);
}

.nm-healthCard {
  display: grid;
  grid-template-columns: minmax(8rem, 0.35fr) minmax(0, 1fr);
  gap: 1.5rem;
  align-items: center;
  padding: 1.25rem;
}

.nm-healthSummary {
  padding-right: 1.25rem;
  border-right: 1px solid var(--nidus-parchment);
}

.nm-healthScore {
  font-family: var(--nidus-font-serif);
  font-size: clamp(2.7rem, 7vw, 4rem);
  font-weight: 500;
  line-height: 0.95;
  color: var(--nidus-sage);
}

.nm-healthScoreLabel {
  margin-top: 0.45rem;
  font-size: 0.75rem;
  font-weight: 600;
}

.nm-healthMetrics {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}

.nm-healthMetricHeading {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.3rem;
  font-size: 0.68rem;
}

.nm-healthMetricHeading span {
  color: color-mix(in srgb, var(--nidus-ink) 62%, transparent);
}

.nm-healthMetricHeading strong {
  font-family: var(--nidus-font-mono);
  font-size: 0.64rem;
  font-weight: 500;
}

.nm-healthTrack {
  overflow: hidden;
  height: 0.42rem;
  border-radius: 999px;
  background: var(--nidus-parchment);
}

.nm-healthFill {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--nidus-sage);
}

.nm-energyLiveCard {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 1rem 1.2rem;
}

.nm-energyWatts {
  font-family: var(--nidus-font-serif);
  font-size: clamp(1.65rem, 4vw, 2.25rem);
  font-weight: 500;
  line-height: 1;
}

.nm-liveBadge {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.35rem 0.65rem;
  border-radius: 999px;
  font-family: var(--nidus-font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  color: var(--nidus-sage);
  background: color-mix(in srgb, var(--nidus-sage) 10%, transparent);
}

.nm-liveDot {
  width: 0.48rem;
  height: 0.48rem;
  border-radius: 50%;
  background: var(--nidus-sage);
  animation: livePulse 1.7s ease-out infinite;
}

.nm-energyDetail {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.nm-energyHero,
.nm-energyStatCard,
.nm-energyChartCard,
.nm-energyDeviceCard,
.nm-energyPeakCard,
.nm-energyMeterCard {
  border: 1px solid color-mix(in srgb, var(--nidus-parchment) 82%, transparent);
  border-radius: 18px;
  background: var(--nidus-cream);
  box-shadow: 0 0.45rem 1.3rem rgb(28 25 20 / 0.055);
}

.nm-energyHero {
  position: relative;
  min-height: 15rem;
  overflow: hidden;
}

.nm-energyHeroScene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.nm-energyHero::after {
  content: "";
  position: absolute;
  inset: 35% 0 0;
  background: linear-gradient(to bottom, transparent, rgb(28 25 20 / 0.33));
}

.nm-energyHeroValue {
  position: absolute;
  z-index: 1;
  bottom: 1.35rem;
  left: 1.4rem;
  color: var(--nidus-cream);
  text-shadow: 0 1px 0.7rem rgb(28 25 20 / 0.38);
}

.nm-energyHeroValue .nm-detailEyebrow {
  color: color-mix(in srgb, var(--nidus-cream) 85%, transparent);
}

.nm-energyHeroValue > p:last-child {
  display: flex;
  align-items: baseline;
  gap: 0.55rem;
  margin-top: 0.25rem;
}

.nm-energyHeroValue strong {
  font-family: var(--nidus-font-serif);
  font-size: clamp(2.8rem, 8vw, 4.8rem);
  font-weight: 500;
  line-height: 0.9;
}

.nm-energyHeroValue span {
  font-family: var(--nidus-font-mono);
  font-size: 0.8rem;
}

.nm-energyHeroBadge {
  position: absolute;
  right: 1.25rem;
  bottom: 1.25rem;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  font-family: var(--nidus-font-mono);
  font-size: 0.62rem;
  color: var(--nidus-sage);
  background: color-mix(in srgb, var(--nidus-cream) 92%, transparent);
  box-shadow: 0 0.35rem 1rem rgb(28 25 20 / 0.14);
}

.nm-energyTip {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 0.7rem;
  padding: 0.85rem 1rem;
  border: 1px solid color-mix(in srgb, var(--nidus-sage) 18%, transparent);
  border-radius: 14px;
  font-size: 0.8rem;
  line-height: 1.5;
  color: color-mix(in srgb, var(--nidus-ink) 80%, transparent);
  background: color-mix(in srgb, var(--nidus-sage) 10%, var(--nidus-cream));
}

.nm-energyTip > span {
  font-size: 0.8rem;
  color: var(--nidus-amber);
}

.nm-energyStats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.75rem;
}

.nm-energyStatCard {
  min-width: 0;
  padding: 1rem;
}

.nm-energyStatValue {
  display: flex;
  align-items: baseline;
  gap: 0.35rem;
  margin-top: 0.55rem;
}

.nm-energyStatValue strong {
  overflow-wrap: anywhere;
  font-family: var(--nidus-font-serif);
  font-size: clamp(1.35rem, 3vw, 1.85rem);
  font-weight: 500;
  line-height: 1;
}

.nm-energyStatValue span {
  flex: 0 0 auto;
  font-family: var(--nidus-font-mono);
  font-size: 0.58rem;
  color: color-mix(in srgb, var(--nidus-ink) 56%, transparent);
}

.nm-energyMainGrid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(12rem, 1fr);
  gap: 1rem;
  align-items: start;
}

.nm-energyChartColumn,
.nm-energySideColumn {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.nm-energyChartCard,
.nm-energyDeviceCard,
.nm-energyPeakCard,
.nm-energyMeterCard {
  min-width: 0;
  padding: 1.1rem;
}

.nm-energyCardHeader h4,
.nm-energyPeakHeading h4,
.nm-energyMeterCard h4 {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-family: var(--nidus-font-sans);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--nidus-ink);
}

.nm-energyCardHeader p {
  margin-top: 0.2rem;
  font-family: var(--nidus-font-mono);
  font-size: 0.6rem;
  line-height: 1.45;
  color: color-mix(in srgb, var(--nidus-ink) 50%, transparent);
}

.nm-energyChart {
  width: 100%;
  height: auto;
  margin-top: 0.8rem;
  overflow: visible;
}

.nm-chartGrid line {
  stroke: var(--nidus-parchment);
  stroke-width: 1;
  stroke-dasharray: 4 5;
}

.nm-chartGrid line:nth-child(2) {
  stroke: color-mix(in srgb, var(--nidus-ink) 32%, transparent);
  stroke-dasharray: 2 4;
}

.nm-chartLabels text {
  fill: color-mix(in srgb, var(--nidus-ink) 48%, transparent);
  font-family: var(--nidus-font-mono);
  font-size: 10px;
}

.nm-powerLine {
  fill: none;
  stroke: var(--nidus-sage);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.nm-gasBars rect {
  fill: var(--nidus-amber);
  opacity: 0.78;
}

.nm-energyDeviceControls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.55rem;
  margin-top: 1rem;
}

.nm-energyFakeSelect,
.nm-energyStartButton {
  min-height: 2.45rem;
  display: flex;
  align-items: center;
  border-radius: 10px;
  font-size: 0.7rem;
}

.nm-energyFakeSelect {
  justify-content: space-between;
  gap: 0.75rem;
  min-width: 0;
  padding: 0.55rem 0.7rem;

<div class="nm-root {{themeClass}}" style="width: {{w}}px; max-width: 100%">
<div class="nm-mockups">
<p class="nm-note">{{note}}</p>
<div class="nm-deviceToggle" role="tablist" aria-label="{{deviceAria}}">
<button type="button" class="{{webClass}}" aria-pressed="{{webPressed}}" onClick="{{setWeb}}">Web</button>
<button type="button" class="{{mobClass}}" aria-pressed="{{mobPressed}}" onClick="{{setMobile}}">{{mobileLabel}}</button>
</div>

<sc-if value="{{isWeb}}" hint-placeholder-val="{{ true }}">
<div class="nm-nidusFrame nm-browserFrame">
<div class="nm-browserChrome"><div class="nm-windowControls" aria-hidden="true"><span></span><span></span><span></span></div></div>
<div class="nm-webLayout">
<aside class="nm-sidebar">
<div class="nm-sidebarBrand"><p>NIDUS</p><span>Robin</span></div>
<nav class="nm-sidebarNav" aria-label="{{navAria}}">
<sc-for list="{{sidebar}}" as="it" hint-placeholder-count="10">
<sc-if value="{{it.enabled}}" hint-placeholder-val="{{ false }}"><button type="button" class="{{it.cls}}" aria-current="{{it.current}}" onClick="{{it.pick}}"><span aria-hidden="true">{{it.icon}}</span>{{it.label}}</button></sc-if>
<sc-if value="{{it.disabled}}" hint-placeholder-val="{{ true }}"><span class="nm-sidebarItemDisabled" aria-disabled="true"><span aria-hidden="true">{{it.icon}}</span>{{it.label}}</span></sc-if>
</sc-for>
</nav>
<p class="nm-sidebarFooter">{{logout}}</p>
</aside>
<div class="nm-contentPane">
<dc-import name="NidusScreen" screen="{{screen}}" lang="{{lang}}" w="{{ 2000 }}" uid="web" hint-size="100%,900px"></dc-import>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isMobile}}" hint-placeholder-val="{{ false }}">
<div class="nm-nidusFrame nm-phoneFrame">
<div class="nm-phoneStatus" aria-hidden="true"><span>9:41</span><span class="nm-phoneNotch"></span><span>5G&nbsp;&nbsp;100%</span></div>
<div class="nm-phoneBody">
<dc-import name="NidusScreen" screen="{{screen}}" lang="{{lang}}" phone="{{ true }}" w="{{ 2000 }}" uid="mob" hint-size="100%,900px"></dc-import>
</div>
<nav class="nm-mobileTabs" aria-label="{{tabsAria}}">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2"><button type="button" class="{{tb.cls}}" aria-pressed="{{tb.pressed}}" onClick="{{tb.pick}}"><span aria-hidden="true">{{tb.icon}}</span>{{tb.label}}</button></sc-for>
</nav>
</div>
</sc-if>
</div>
</div>
</x-dc>
